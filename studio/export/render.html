<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/studio/fonts.css"><style>body{margin:0}canvas{display:block;width:720px;height:1280px}</style><div id="scene"></div><script type="module">
import{TimelinePlayer}from'/studio/timeline/player.mjs';import{loadFonts}from'/studio/core/player.mjs';
