<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Studio · AI 教程组件工作台</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="studio.css"></head><body>
<aside class="sidebar"><a class="brand" href="/studio/"><span class="brandmark">m<span>✦</span></span><div>Motion Studio<small>你的镜头，自己的风格</small></div></a><div class="workspace"><span class="workspace-icon">J</span><div>我的创作空间<small>本地工作台</small></div><span class="dot"></span></div><div class="nav-label">创作资源</div><nav id="nav"><button data-view="components" class="active"><span>▦</span>组件库 <b id="nav-count">6</b></button><button data-view="presets"><span>▣</span>我的封装</button><button data-view="styles"><span>◈</span>风格管理</button><button data-view="assets"><span>▧</span>素材库</button><div class="nav-label">开发进度</div><button data-view="roadmap"><span>↗</span>能力路线</button></nav><div class="sidebar-foot"><div class="fork-label">Agent Motion 二创</div><p>先把一个组件打磨好，<br>再让它进入你的每支视频。</p><a href="https://github.com/JamwongH/agent-motion-studio" target="_blank" rel="noopener">查看源码 <span>↗</span></a></div></aside>
<div class="shell"><header><div><span class="muted">工作台</span><span class="separator">/</span><span id="breadcrumb">组件库</span></div><div class="header-right"><span class="local-badge"><i></i> 素材保存在本机</span><span class="avatar">J</span></div></header><div class="body-grid"><main id="main"><div class="page-heading"><div><div class="eyebrow">YOUR MOTION LIBRARY</div><h1 id="page-title">组件库</h1><p id="page-description">把重复的包装动作，变成可复用的积木。</p></div><button class="primary" id="new-component">＋ 新建封装</button></div><section id="content"></section></main><aside class="inspector"><div class="inspector-heading"><span class="eyebrow">LIVE PREVIEW</span><span class="preview-live"><i></i> 动态预览</span></div><div class="selected-name"><h2 id="selected-title">透视录屏</h2><span id="selected-category">演示</span></div><div id="preview" class="preview"></div><div class="play-controls"><button id="play" aria-label="暂停预览">Ⅱ</button><input id="time" type="range" min="0" max="8" value="0" step=".01" aria-label="预览时间"><output id="time-label">0.00 / 8s</output></div><div class="detail-tabs"><button class="active" data-detail="params">组件参数</button><button data-detail="media">素材绑定</button></div><div id="parameter-form"></div><div id="media-form" hidden></div><div class="inspector-actions"><button id="save-preset" class="primary">另存为我的组件</button><div><button id="export-json" class="secondary">导出配置</button><button id="export-scene" class="secondary">生成镜头</button></div><a id="scene-link" hidden target="_blank" rel="noopener">打开生成的镜头 ↗</a></div></aside></div></div>
<div id="toast" role="status" hidden></div><dialog id="preset-dialog"><form method="dialog" id="preset-form"><span class="eyebrow">SAVE A COMPONENT</span><h2>把这次调试，留给下一次</h2><p>当前参数、风格和素材绑定会一起保存。</p><label>组件名称<input id="preset-name" required maxlength="60" placeholder="例如：我的红字教学演示"></label><label>基础组件<select id="preset-base"></select></label><div class="dialog-actions"><button value="cancel" class="secondary" formnovalidate>取消</button><button id="confirm-save" class="primary" value="save">保存组件</button></div></form></dialog>
<input hidden id="asset-upload" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm"><input hidden id="json-import" type="file" accept=".json"><script type="module" src="app.mjs"></script></body></html>
